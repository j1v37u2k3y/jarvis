repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: venv/bin/mypy --config-file=pyproject.toml .
        language: system
        types: [python]
        pass_filenames: false

      # NOTE: dependency CVE scanning (pip-audit) intentionally does NOT run
      # here. It lives in CI (.github/workflows/ci.yml -> ./ci security) and
      # Dependabot (alerts + automated security-fix PRs, enabled in repo
      # settings), both on Linux — the platform that actually ships. The old
      # local pre-push pip-audit hook only ever flagged torch 2.2.2 CVEs that
      # are macOS x86_64-only and unfixable (no newer Intel-Mac wheel), so it
      # forced a growing ignore-list of vulns that don't exist in production.
      # Dropped it rather than curate exclusions. CI + Dependabot are the
      # authoritative dependency scanners.

      # Code-level security scan. Fast — runs every commit. ALL severities
      # surface; the policy-level skips (subprocess noise, resilient
      # try/except, non-crypto random) are configured in pyproject.toml's
      # [tool.bandit] block with per-rule justification. Anything new
      # that isn't already policy-approved fails the commit.
      - id: bandit
        name: bandit
        entry: venv/bin/bandit -c pyproject.toml -r . -q
        language: system
        types: [python]
        pass_filenames: false

      # Full test suite. ~10s, so scoped to pre-push (not every commit) —
      # commits stay fast, but no red test leaves the machine for CI to
      # catch. This MIRRORS the `ci` script's pytest invocation exactly
      # (same --ignore + marker deselection): test_browser_integration.py
      # needs Playwright, and the requires_* markers need live services.
      # If you change the `ci` script's pytest line, change this one too.
      - id: pytest
        name: pytest (full suite, CI-equivalent)
        entry: >
          venv/bin/python -m pytest tests/
          --ignore=tests/test_browser_integration.py
          -m "not requires_mc and not requires_api and not requires_network"
        language: system
        pass_filenames: false
        stages: [pre-push]
